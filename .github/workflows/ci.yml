#
# Check-build of tuner-gtk4 in the GNOME SDK (GTK4 is not in the plain freedesktop runtime; the GNOME runtime is built
# on it), against the tuner-core repository of the same owner (main branch, or the ref chosen when started by hand).
# The SDK is already in the container image, so only libgee and libqrencode are built (and cached).
# The image and runtime-version in the manifest must be changed together when GNOME moves on. Runs when Vala sources, translation lists
# or build files change (and by hand from the Actions tab).

name: CI

on:
  push:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'po/**/POTFILES'
      - 'po/**/LINGUAS'
      - 'scripts/merge-po.sh'
      - 'data/**'
      - 'scripts/check-potfiles.sh'
      - '.github/flatpak/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'po/**/POTFILES'
      - 'po/**/LINGUAS'
      - 'scripts/merge-po.sh'
      - 'data/**'
      - 'scripts/check-potfiles.sh'
      - '.github/flatpak/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'tuner-core branch, tag or commit to build against'
        default: 'main'
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (GNOME 51 SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out tuner-gtk4
        uses: actions/checkout@v4

      - name: Check out tuner-core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tuner-core
          ref: ${{ inputs.core_ref || 'main' }}
          path: core

      - name: Translation lists are complete
        run: |
          ln -sfn "$GITHUB_WORKSPACE/core" subprojects/tuner-core
          scripts/check-potfiles.sh
          rm subprojects/tuner-core

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: .github/flatpak/io.github.tuner_labs.tuner.gtk4.ci.yml
          cache-key: flatpak-builder-gtk4-${{ hashFiles('.github/flatpak/*.yml') }}
          build-bundle: false
          upload-artifact: false
