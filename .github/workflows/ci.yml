#
# Check-build of tuner-gtk4 against the tuner-core repository of the same owner (main branch): the core is checked
# out as subprojects/tuner-core, as on a developer machine. Runs when Vala sources, translation lists or build files
# change (and by hand from the Actions tab). Ubuntu 24.04 packages, as on Mint 22.

name: CI

on:
  push:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'po/**/POTFILES'
      - 'data/**'
      - 'scripts/check-potfiles.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.vala'
      - '**.vala.in'
      - 'vapi/**'
      - '**/meson.build'
      - 'meson_options.txt'
      - 'po/**/POTFILES'
      - 'data/**'
      - 'scripts/check-potfiles.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'tuner-core branch, tag or commit to build against'
        default: 'main'
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tuner-gtk4
        uses: actions/checkout@v4

      - name: Check out tuner-core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tuner-core
          ref: ${{ inputs.core_ref || 'main' }}
          path: core

      - name: Link the core as a subproject
        run: ln -sfn "$GITHUB_WORKSPACE/core" subprojects/tuner-core

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac meson ninja-build pkg-config gettext python3 libglib2.0-bin \
            libglib2.0-dev libgee-0.8-dev libgstreamer1.0-dev \
            libsoup-3.0-dev libjson-glib-dev \
            libgtk-4-dev librsvg2-dev libqrencode-dev

      - name: Translation lists are complete
        run: scripts/check-potfiles.sh

      - name: Configure
        run: meson setup build --buildtype=debug

      - name: Compile
        run: meson compile -C build

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-logs/
