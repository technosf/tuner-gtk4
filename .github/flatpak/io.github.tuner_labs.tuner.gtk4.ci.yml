#
# CI manifest for tuner-gtk4: builds the app in the GNOME SDK (GTK4 is not in the plain freedesktop runtime; the GNOME
# runtime is built on freedesktop), with libgee and libqrencode as modules like the Flatpak manifests. The workflow
# checks tuner-core out into ../../core. Used by .github/workflows/ci.yml. The runtime version must match the
# container image in the workflow (gnome-51 image = runtime 51).
---
app-id: io.github.tuner_labs.tuner.gtk4
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
command: tuner-gtk4

build-options:
  prepend-path: /usr/lib/sdk/vala/bin/
  prepend-ld-library-path: /usr/lib/sdk/vala/lib

modules:
  - name: libgee
    buildsystem: autotools
    build-options:
      cflags: -Wno-error=incompatible-pointer-types
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee

  - name: libqrencode
    # Same source as the freedesktop-sdk libqrencode.bst; no command-line tool, no tests
    buildsystem: autotools
    config-opts:
      - --without-tools
      - --without-tests
    sources:
      - type: git
        url: https://github.com/fukuchi/libqrencode.git
        tag: v4.1.1
        commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8

  - name: tuner-gtk4
    buildsystem: meson
    config-opts:
      - --buildtype=debug
      - -Dpackaging=flatpak
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - core
      - type: dir
        # The core, checked out by the workflow next to this repository's files
        path: ../../core
        dest: subprojects/tuner-core
        skip:
          - .git
          - build
